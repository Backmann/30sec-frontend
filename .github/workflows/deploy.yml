name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/30sec-frontend
            echo "-> Pulling latest code..."
            git pull origin main
            cd /root/30sec
            echo "-> Rebuilding frontend container..."
            docker compose up -d --build frontend
            echo "-> Waiting for health check (up to 90s)..."
            for i in {1..9}; do
              sleep 10
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' 30sec-frontend 2>/dev/null || echo "unknown")
              echo "Check $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "OK: Frontend is healthy!"
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "FAIL: Frontend became unhealthy"
                docker compose logs frontend --tail 30
                exit 1
              fi
            done
            echo "FAIL: Timeout waiting for healthy status"
            docker compose logs frontend --tail 30
            exit 1
