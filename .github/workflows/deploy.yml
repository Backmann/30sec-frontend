name: Deploy Frontend
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/30sec-frontend
            echo "-> Pulling latest code..."
            git pull origin main
            cd /root/30sec

            echo "-> Clean up any stale frontend containers..."
            docker ps -a --filter "name=30sec-frontend" --format "{{.Names}}" | xargs -r docker rm -f || true

            echo "-> Rebuilding and starting frontend container..."
            docker compose up -d --build frontend

            echo "-> Waiting for health check (up to 90s)..."
            for i in 1 2 3 4 5 6 7 8 9; do
              sleep 10
              STATUS=$(docker inspect --format="{{.State.Health.Status}}" 30sec-frontend 2>/dev/null || echo "missing")
              echo "   [attempt $i/9] status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "OK: Frontend is healthy!"
                exit 0
              fi
            done

            echo "FAIL: Frontend did not become healthy in time"
            docker compose logs frontend --tail 50
            exit 1
